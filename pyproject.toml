[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.0"
description = "Jarvis — sistema operacional cognitivo pessoal (single-user)"
requires-python = ">=3.12"

# Dependências da v0 (tools.md 1.2, 1.3, 1.6). Nada aqui é de v1 em diante.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",              # driver async da app
    "psycopg[binary]",      # driver síncrono, exigido pelo Alembic
    "alembic",
    "httpx",
    "structlog",
    "anthropic",
    "python-multipart",     # upload via form-data no FastAPI
    "websockets",           # streaming de tokens e eventos
    "jsonschema",           # valida input_schema das ToolSpec (MCP)
    "pyyaml",               # manifest.yaml / permissions.yaml das capabilities
    "openai",               # API compatível para LM Studio / local
    # Verificação do JWT do Cloudflare Access na origem (apps/api/cf_access.py).
    # O extra [crypto] NÃO é opcional aqui: sem ele o PyJWT só assina/verifica
    # HMAC, e `RSAAlgorithm.from_jwk` levanta NotImplementedError — o Access
    # assina em RS256. É o extra que traz a `cryptography`.
    "PyJWT[crypto]>=2.8",
    # v1.4 — jobs recorrentes (backup, reindex, limpeza).
    "apscheduler>=3.10",
    # v1.3 — memória `knowledge`: vetores embarcados, backup é copiar o diretório.
    "lancedb>=0.13",
    # v2 - EventBus Redis Streams
    "redis>=5.0.0",
    # v3 - Model Context Protocol
    "mcp>=1.0.0",
    "fastmcp>=3.0.0",
    "google-genai>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "types-pyyaml",
    "types-jsonschema",
]

# Layout flat: os pacotes de topo do monorepo são importáveis como `apps.*`,
# `packages.*` e `orchestrator.*`. namespaces=true dispensa __init__.py.
[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "orchestrator*", "capabilities*"]
exclude = ["apps.web*", "graphify*", "graphify-out*", "tools*"]
namespaces = true

# ---------------------------------------------------------------------------
# Ruff — lint + ordenação de imports (substitui o isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py312"
exclude = ["graphify", "graphify-out", "apps/web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations do Alembic são geradas; não vale brigar com o gerador.
"apps/api/alembic/versions/*.py" = ["E501"]
# B008 (chamada de função no default do parâmetro) é exatamente o idioma
# `Depends(...)` do FastAPI: sem ele não há injeção. Silenciar aqui é reconhecer
# o falso positivo; deixar ligado tornaria o passo de ruff do CI impossível de
# passar, e um lint que nunca passa deixa de ser lido.
"apps/api/routers/*.py" = ["B008"]
"apps/api/deps.py" = ["B008"]

# ---------------------------------------------------------------------------
# Black — formatação
# ---------------------------------------------------------------------------
[tool.black]
line-length = 90
target-version = ["py312"]
extend-exclude = "/(graphify|graphify-out|apps/web|\\.venv)/"

# ---------------------------------------------------------------------------
# mypy — gradual no geral, estrito nos pacotes de contrato
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["packages", "apps/api", "orchestrator", "capabilities", "tests"]
exclude = "(graphify|graphify-out|apps/web)"
# `apps/api/__init__.py` existe e `apps/__init__.py` não, então o mypy deduzia
# duas raízes para o mesmo arquivo ("found twice under different module names")
# e abortava antes de checar qualquer coisa. Com a base explícita, o módulo é
# sempre `apps.api.*`, igual ao que o runtime importa.
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# tools.md 6: contratos e camada de LLM não têm desculpa para tipo frouxo.
module = ["packages.shared.*", "packages.llm.*"]
strict = true

[[tool.mypy.overrides]]
# O Capability SDK é o contrato contra o qual a v3 gera código (plan.md §8):
# gerar contra tipo frouxo produz capability que só falha em runtime.
module = ["packages.capabilities.*"]
strict = true

[[tool.mypy.overrides]]
# Migrations geradas ficam de fora do rigor.
module = ["apps.api.alembic.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest — critério de aceite de milestone
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Escopo explícito: sem isto o pytest-asyncio 1.x avisa a cada execução, e aviso
# ignorado em suíte nova vira aviso ignorado para sempre.
asyncio_default_fixture_loop_scope = "function"
# `packages` e `apps/api` ficam de fora: não têm arquivo de teste, e listá-los só
# custava tempo de coleta. `capabilities` entra porque o teste de uma capability
# mora dentro dela (`plan-scheme.md`) e é anexo obrigatório do Gate 2 — fora do
# testpaths ele existiria sem nunca rodar, que é o mesmo que não existir.
testpaths = ["tests", "capabilities"]
pythonpath = ["."]
# Sem `-q` embutido: o comando documentado é `pytest -q`, e com o -q daqui ele
# virava -qq, que esconde justamente a linha de passou/falhou que é o aceite.

# ---------------------------------------------------------------------------
# coverage — medida sobre `packages/`, que é onde vive a regra de negócio.
# Fora do addopts de propósito: cobertura é relatório sob demanda
# (`pytest --cov`), não imposto em cada execução local.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["packages"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # corpo de método de Protocol
]
