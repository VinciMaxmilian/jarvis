<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S. — Knowledge Core</title>
<style>
  :root{
    --cy:#37e0ff; --cy-dim:#1b6a80; --gold:#ffb020; --red:#ff5470;
    --bg:#02060c; --panel:rgba(6,18,28,.62); --line:rgba(55,224,255,.28);
    --txt:#bfeaf6; --txt-dim:#5f8a99;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{
    font:11px/1.45 "Consolas","SF Mono","Menlo",ui-monospace,monospace;
    color:var(--txt); letter-spacing:.06em;
    -webkit-font-smoothing:antialiased;
  }
  canvas{position:fixed;inset:0;display:block;cursor:grab}
  canvas.drag{cursor:grabbing}

  /* ---- ambient overlays ---- */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 75% 65% at 50% 48%,transparent 0%,transparent 45%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%)}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.35;
    background:repeating-linear-gradient(0deg,rgba(55,224,255,.055) 0 1px,transparent 1px 3px)}
  #flick{position:fixed;inset:0;pointer-events:none;z-index:4;background:var(--cy);opacity:0;
    mix-blend-mode:overlay;animation:fl 7s infinite}
  @keyframes fl{0%,96%,100%{opacity:0}97%{opacity:.03}98.5%{opacity:.015}}

  .hud{position:fixed;z-index:10;pointer-events:none}
  .hud *{pointer-events:auto}

  /* ---- corner brackets ---- */
  .br{position:fixed;width:34px;height:34px;border:1px solid var(--line);z-index:9;pointer-events:none}
  .br.tl{top:14px;left:14px;border-right:0;border-bottom:0}
  .br.tr{top:14px;right:14px;border-left:0;border-bottom:0}
  .br.bl{bottom:14px;left:14px;border-right:0;border-top:0}
  .br.brr{bottom:14px;right:14px;border-left:0;border-top:0}

  /* ---- title ---- */
  #title{top:26px;left:34px}
  #title h1{font-size:19px;font-weight:400;letter-spacing:.62em;color:#eafcff;
    text-shadow:0 0 18px rgba(55,224,255,.75),0 0 44px rgba(55,224,255,.3)}
  #title .sub{margin-top:5px;color:var(--cy);opacity:.85;letter-spacing:.3em;font-size:9.5px}
  #title .meta{margin-top:9px;color:var(--txt-dim);font-size:9px;letter-spacing:.14em}
  #title .meta b{color:var(--cy);font-weight:400}

  /* ---- readout ---- */
  #stats{top:26px;right:34px;text-align:right}
  .stat{margin-bottom:7px}
  .stat .k{color:var(--txt-dim);font-size:8.5px;letter-spacing:.24em}
  .stat .v{font-size:20px;color:var(--cy);line-height:1.05;
    text-shadow:0 0 14px rgba(55,224,255,.6)}
  .stat .v small{font-size:9px;color:var(--txt-dim);letter-spacing:.12em}
  #warn{margin-top:12px;max-width:260px;border:1px solid rgba(255,84,112,.45);
    background:rgba(255,84,112,.08);color:#ffb3c0;padding:6px 8px;font-size:8.5px;
    letter-spacing:.1em;line-height:1.6;text-align:left}
  #warn b{color:var(--red);font-weight:400;letter-spacing:.2em}

  /* ---- legend ---- */
  #legend{bottom:30px;left:34px;max-width:270px}
  #legend .hd{color:var(--txt-dim);font-size:8.5px;letter-spacing:.26em;margin-bottom:9px}
  .lg{display:flex;align-items:center;gap:8px;padding:2.5px 0;cursor:pointer;
    opacity:.9;transition:opacity .15s,transform .15s}
  .lg:hover{opacity:1;transform:translateX(3px)}
  .lg.off{opacity:.24}
  .lg .dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;box-shadow:0 0 9px currentColor;
    background:currentColor}
  .lg .nm{font-size:9.5px;letter-spacing:.09em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg .ct{margin-left:auto;color:var(--txt-dim);font-size:8.5px}

  /* ---- controls ---- */
  #ctl{bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
  #q{width:230px;background:rgba(4,14,22,.8);border:1px solid var(--line);color:var(--txt);
    padding:7px 11px;font:inherit;letter-spacing:.12em;outline:none;transition:.18s}
  #q:focus{border-color:var(--cy);box-shadow:0 0 16px rgba(55,224,255,.25)}
  #q::placeholder{color:var(--txt-dim);letter-spacing:.2em}
  .btn{background:rgba(4,14,22,.8);border:1px solid var(--line);color:var(--txt);
    padding:7px 12px;font:inherit;letter-spacing:.16em;cursor:pointer;transition:.18s;font-size:9px}
  .btn:hover{border-color:var(--cy);color:#eafcff;box-shadow:0 0 16px rgba(55,224,255,.22)}
  .btn.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 16px rgba(255,176,32,.22)}

  /* ---- detail panel ---- */
  #panel{top:50%;right:34px;transform:translateY(-50%) translateX(24px);width:330px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(9px);
    padding:16px 17px;opacity:0;visibility:hidden;transition:.22s;max-height:66vh;
    overflow-y:auto;box-shadow:0 0 44px rgba(0,0,0,.65),inset 0 0 42px rgba(55,224,255,.05)}
  #panel.on{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0)}
  #panel::-webkit-scrollbar{width:3px}
  #panel::-webkit-scrollbar-thumb{background:var(--cy-dim)}
  #panel .x{position:absolute;top:11px;right:13px;color:var(--txt-dim);cursor:pointer;font-size:13px;line-height:1}
  #panel .x:hover{color:var(--cy)}
  #panel h2{font-size:13.5px;font-weight:400;color:#eafcff;letter-spacing:.06em;
    line-height:1.4;padding-right:20px;text-shadow:0 0 14px rgba(55,224,255,.4)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 13px}
  .tag{font-size:8px;letter-spacing:.16em;padding:2.5px 6px;border:1px solid var(--line);color:var(--cy)}
  .tag.gd{border-color:var(--gold);color:var(--gold)}
  .row{display:flex;gap:9px;padding:4px 0;font-size:9px;border-top:1px solid rgba(55,224,255,.1)}
  .row .k{color:var(--txt-dim);flex:0 0 74px;letter-spacing:.16em}
  .row .v{color:var(--txt);word-break:break-word;flex:1}
  .sec{margin-top:14px;color:var(--txt-dim);font-size:8.5px;letter-spacing:.26em;
    border-bottom:1px solid rgba(55,224,255,.16);padding-bottom:5px;margin-bottom:8px}
  .why{font-size:9.5px;line-height:1.7;color:#a6d8e6;font-style:italic;
    border-left:2px solid var(--cy-dim);padding-left:9px}
  .cx{display:flex;gap:7px;align-items:baseline;padding:3.5px 0;cursor:pointer;font-size:9px;transition:.13s}
  .cx:hover{transform:translateX(3px)}
  .cx:hover .lb{color:#eafcff}
  .cx .ar{color:var(--cy);opacity:.55;flex:0 0 auto}
  .cx .rl{color:var(--txt-dim);font-size:8px;letter-spacing:.1em;flex:0 0 auto}
  .cx .lb{color:var(--txt);flex:1}
  .cx.inf .ar{color:var(--gold)}
  .cx.amb .ar{color:var(--red)}

  #hint{bottom:9px;left:50%;transform:translateX(-50%);color:var(--txt-dim);
    font-size:8px;letter-spacing:.2em;opacity:.5}
  #tip{position:fixed;z-index:11;pointer-events:none;background:rgba(4,14,22,.92);
    border:1px solid var(--line);padding:4px 8px;font-size:9px;letter-spacing:.08em;
    color:#eafcff;opacity:0;transition:opacity .1s;white-space:nowrap}
  @media(max-width:900px){
    #panel{right:14px;width:270px} #legend{display:none} #title h1{font-size:15px;letter-spacing:.4em}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div><div id="scan"></div><div id="flick"></div>
<div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>

<div class="hud" id="title">
  <h1>J.A.R.V.I.S.</h1>
  <div class="sub">KNOWLEDGE CORE // 3D</div>
  <div class="meta">BUILD <b id="mCommit">—</b> · <span id="mMode">CORTEX</span></div>
</div>

<div class="hud" id="stats">
  <div class="stat"><div class="k">NODES</div><div class="v" id="sN">0</div></div>
  <div class="stat"><div class="k">EDGES</div><div class="v" id="sE">0</div></div>
  <div class="stat"><div class="k">CLUSTERS</div><div class="v" id="sC">0</div></div>
  <div id="warn"><b>◈ INTEGRITY</b><br>5 arestas com endpoint pendente · 1 aresta colapsada</div>
</div>

<div class="hud" id="legend"><div class="hd">CLUSTERS · clique p/ isolar</div><div id="lgList"></div></div>

<div class="hud" id="ctl">
  <input id="q" placeholder="BUSCAR NÓ..." autocomplete="off" spellcheck="false">
  <button class="btn on" id="bLobe">LOBOS</button>
  <button class="btn on" id="bSpin">ROTAÇÃO</button>
  <button class="btn" id="bReal">REALINHAR</button>
</div>

<div class="hud" id="panel">
  <div class="x" id="pX">✕</div>
  <h2 id="pT">—</h2>
  <div class="tags" id="pTags"></div>
  <div id="pRows"></div>
  <div id="pWhy"></div>
  <div class="sec" id="pCxHd">CONEXÕES</div>
  <div id="pCx"></div>
</div>

<div class="hud" id="hint">ARRASTAR ROTACIONA · SCROLL AMPLIA · CLIQUE INSPECIONA · ESC LIMPA</div>
<div id="tip"></div>

<script>
"use strict";
const GRAPH  = /*__DATA__*/{nodes:[],links:[],hyperedges:[]};
const CLABEL = /*__LABELS__*/{};

/* ═══ palette ═══ */
const PAL = ["#00e5ff","#ffb020","#4d9dff","#00ffc8","#b06bff","#ff7a3d","#7dff6f","#ff5c8a"];
const col = c => PAL[(c|0) % PAL.length];
const hex2rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const RGB = {}; PAL.forEach(h => RGB[h] = hex2rgb(h));
const rgba = (h,a) => { const c = RGB[h] || hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

/* ═══ data ═══ */
const nodes = GRAPH.nodes.map(n => ({...n, x:0,y:0,z:0, vx:0,vy:0,vz:0, deg:0, sx:0,sy:0,sc:1,dz:0}));
const byId  = new Map(nodes.map(n => [n.id, n]));
const links = GRAPH.links.map(l => ({...l, s:byId.get(l.source), t:byId.get(l.target)}))
                         .filter(l => l.s && l.t && l.s !== l.t);
links.forEach(l => { l.s.deg++; l.t.deg++; });

const nbr = new Map(nodes.map(n => [n.id, []]));
links.forEach(l => { nbr.get(l.s.id).push({n:l.t, l}); nbr.get(l.t.id).push({n:l.s, l}); });

[...nodes].sort((a,b) => b.deg - a.deg).slice(0,10).forEach(n => n.god = true);
nodes.forEach(n => { n.r = 2.6 + Math.sqrt(n.deg) * 2.35; n.c = col(n.community); });

const comms = {};
nodes.forEach(n => { (comms[n.community] = comms[n.community] || []).push(n); });
const commIds = Object.keys(comms).map(Number).sort((a,b) => a-b);
const hidden = new Set();

/* seed on a fibonacci sphere, split by community so lobes form fast */
{ const N = nodes.length, GA = Math.PI * (3 - Math.sqrt(5));
  nodes.forEach((n,i) => {
    const y = 1 - (i / (N-1)) * 2, r = Math.sqrt(Math.max(0,1-y*y)), th = GA*i;
    const R = 250 + Math.random()*40;
    n.x = Math.cos(th)*r*R*1.25 + (n.community % 2 ? 90 : -90);
    n.y = y*R*0.62; n.z = Math.sin(th)*r*R;
  });
}

/* ═══ canvas ═══ */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();

/* ═══ camera ═══ */
let yaw = 0.4, pitch = -0.22, zoom = 1, dist = 780;
let spin = true, lobes = true, alpha = 1;
let panX = 0, panY = 0, panZ = 0, tgX = 0, tgY = 0, tgZ = 0;

/* ═══ physics ═══ */
function step(){
  if (alpha < 0.0012) return;
  const REP = 2400, SPR = 0.028, LEN = 92;
  for (let i = 0; i < nodes.length; i++){
    const a = nodes[i];
    for (let j = i+1; j < nodes.length; j++){
      const b = nodes[j];
      let dx = a.x-b.x, dy = a.y-b.y, dz = a.z-b.z;
      let d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < 1) { d2 = 1; dx = Math.random()-0.5; dy = Math.random()-0.5; dz = Math.random()-0.5; }
      const d = Math.sqrt(d2), f = REP / d2 / d;
      a.vx += dx*f; a.vy += dy*f; a.vz += dz*f;
      b.vx -= dx*f; b.vy -= dy*f; b.vz -= dz*f;
    }
  }
  for (const l of links){
    const a = l.s, b = l.t;
    const dx = b.x-a.x, dy = b.y-a.y, dz = b.z-a.z;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    const f = (d - LEN) * SPR / d;
    a.vx += dx*f; a.vy += dy*f; a.vz += dz*f;
    b.vx -= dx*f; b.vy -= dy*f; b.vz -= dz*f;
  }
  for (const n of nodes){
    /* ellipsoid gravity — wide, slightly flattened: reads as a cortex */
    n.vx -= n.x * 0.0026; n.vy -= n.y * 0.0072; n.vz -= n.z * 0.0038;
    /* interhemispheric fissure */
    if (lobes){
      const side = (n.community % 2) ? 1 : -1, want = side * 120;
      n.vx += (want - n.x) * 0.0022;
      if (Math.abs(n.x) < 55) n.vx += side * 0.55;
    }
    n.vx *= 0.86; n.vy *= 0.86; n.vz *= 0.86;
    n.x += n.vx * alpha; n.y += n.vy * alpha; n.z += n.vz * alpha;
  }
  alpha *= 0.994;
}

/* ═══ projection ═══ */
function project(n){
  const x = n.x - panX, y = n.y - panY, z = n.z - panZ;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const x1 = x*cy - z*sy, z1 = x*sy + z*cy;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y2 = y*cp - z1*sp, z2 = y*sp + z1*cp;
  const sc = (dist * zoom) / Math.max(120, dist + z2);
  n.sx = W/2 + x1*sc; n.sy = H/2 + y2*sc; n.sc = sc; n.dz = z2;
}

/* ═══ interaction state ═══ */
let hover = null, sel = null, query = "", matched = null;
const visible = n => !hidden.has(n.community);
const lit = n => {
  if (matched && !matched.has(n.id)) return false;
  return true;
};
function focusSet(){
  const f = sel || hover; if (!f) return null;
  const s = new Set([f.id]); nbr.get(f.id).forEach(e => s.add(e.n.id)); return s;
}

/* ═══ render ═══ */
let t = 0;
function draw(){
  t += 0.016;
  if (spin && !drag) yaw += 0.0016;
  panX += (tgX - panX)*0.08; panY += (tgY - panY)*0.08; panZ += (tgZ - panZ)*0.08;
  step();
  nodes.forEach(project);

  ctx.clearRect(0,0,W,H);
  /* backdrop */
  const g = ctx.createRadialGradient(W/2,H*0.48,0,W/2,H*0.48,Math.max(W,H)*0.62);
  g.addColorStop(0,"#061722"); g.addColorStop(0.55,"#030b13"); g.addColorStop(1,"#02060c");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  /* containment rings */
  ctx.save(); ctx.translate(W/2,H*0.48);
  for (let i = 0; i < 3; i++){
    const rr = (230 + i*95) * zoom;
    ctx.beginPath(); ctx.ellipse(0,0,rr,rr*0.30,Math.sin(t*0.13 + i)*0.09,0,Math.PI*2);
    ctx.strokeStyle = `rgba(55,224,255,${0.08 - i*0.02})`; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(0,0,300*zoom, t*0.22, t*0.22 + 1.15);
  ctx.strokeStyle = "rgba(255,176,32,.16)"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath();
  ctx.arc(0,0,332*zoom, -t*0.17 + 3, -t*0.17 + 3.7);
  ctx.strokeStyle = "rgba(55,224,255,.2)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  const fset = focusSet();

  /* edges */
  ctx.lineCap = "round";
  for (const l of links){
    const a = l.s, b = l.t;
    if (!visible(a) || !visible(b)) continue;
    const inF = fset ? (fset.has(a.id) && fset.has(b.id)) : true;
    const dim = (fset && !inF) || (matched && !(matched.has(a.id) || matched.has(b.id)));
    const depth = (a.dz + b.dz) / 2;
    let al = 0.16 + 0.3 * (1 - Math.min(1, Math.max(0,(depth + 420)/840)));
    if (fset && inF) al = 0.92;
    if (dim) al *= 0.13;
    const amb = l.confidence === "AMBIGUOUS", inf = l.confidence === "INFERRED";
    ctx.strokeStyle = amb ? `rgba(255,84,112,${al})`
                    : inf ? `rgba(255,176,32,${al*0.8})`
                          : `rgba(55,224,255,${al})`;
    ctx.lineWidth = (fset && inF ? 1.5 : 0.75) * Math.min(1.5, (a.sc + b.sc)/2);
    if (inf || amb){ ctx.setLineDash([3,4]); } else { ctx.setLineDash([]); }
    ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
  }
  ctx.setLineDash([]);

  /* nodes — painter's algorithm, far first */
  const order = nodes.filter(visible).sort((a,b) => b.dz - a.dz);
  for (const n of order){
    const inF = fset ? fset.has(n.id) : true;
    const dim = (fset && !inF) || (matched && !matched.has(n.id));
    const r = n.r * n.sc * (n.god ? 1.22 : 1) * (n === sel ? 1.35 : 1);
    const a  = dim ? 0.13 : (0.42 + 0.58 * Math.min(1, Math.max(0,(420 - n.dz)/840)));

    /* halo */
    const gg = ctx.createRadialGradient(n.sx,n.sy,0,n.sx,n.sy,r*5.5);
    gg.addColorStop(0, rgba(n.c, a*0.5)); gg.addColorStop(0.42, rgba(n.c, a*0.11));
    gg.addColorStop(1, rgba(n.c, 0));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(n.sx,n.sy,r*5.5,0,Math.PI*2); ctx.fill();
    /* core */
    ctx.fillStyle = rgba(n.c, Math.min(1, a*1.25)); ctx.beginPath();
    ctx.arc(n.sx,n.sy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(235,253,255,${a*0.85})`; ctx.beginPath();
    ctx.arc(n.sx,n.sy,r*0.42,0,Math.PI*2); ctx.fill();

    /* god ring */
    if (n.god && !dim){
      ctx.strokeStyle = `rgba(255,176,32,${0.32 + 0.2*Math.sin(t*1.7 + n.deg)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(n.sx,n.sy,r*2.1, t*0.9 + n.deg, t*0.9 + n.deg + 2.1); ctx.stroke();
      ctx.beginPath(); ctx.arc(n.sx,n.sy,r*2.1, t*0.9 + n.deg + Math.PI, t*0.9 + n.deg + Math.PI + 2.1); ctx.stroke();
    }
    /* selection reticle */
    if (n === sel){
      ctx.strokeStyle = "rgba(55,224,255,.85)"; ctx.lineWidth = 1;
      const R = r + 13;
      for (let k = 0; k < 4; k++){
        const A = t*0.55 + k*Math.PI/2;
        ctx.beginPath(); ctx.arc(n.sx,n.sy,R,A,A+0.62); ctx.stroke();
      }
    }
  }

  /* labels */
  ctx.font = "9.5px Consolas,Menlo,monospace"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  for (const n of order){
    const inF = fset ? fset.has(n.id) : false;
    const show = n === sel || n === hover || inF || (matched && matched.has(n.id)) || (!fset && !matched && n.god && n.dz < 160);
    if (!show) continue;
    const r = n.r * n.sc, tx = n.sx + r + 8, ty = n.sy;
    ctx.fillStyle = "rgba(2,8,14,.72)";
    const w = ctx.measureText(n.label).width;
    ctx.fillRect(tx-3, ty-7, w+6, 14);
    ctx.fillStyle = (n === sel || n === hover) ? "#eafcff" : rgba(n.c, 0.92);
    ctx.fillText(n.label, tx, ty);
  }
  requestAnimationFrame(draw);
}

/* ═══ picking ═══ */
function pick(mx,my){
  let best = null, bd = 26;
  for (const n of nodes){
    if (!visible(n)) continue;
    if (matched && !matched.has(n.id)) continue;
    const d = Math.hypot(n.sx-mx, n.sy-my) - n.r*n.sc;
    if (d < bd){ bd = d; best = n; }
  }
  return best;
}

/* ═══ mouse ═══ */
let drag = false, lx = 0, ly = 0, moved = 0;
const tip = document.getElementById("tip");
cv.addEventListener("pointerdown", e => { drag = true; moved = 0; lx = e.clientX; ly = e.clientY; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup",   e => { drag = false; cv.classList.remove("drag"); if (moved < 5){ const n = pick(e.clientX,e.clientY); select(n); } });
cv.addEventListener("pointermove", e => {
  if (drag){
    const dx = e.clientX-lx, dy = e.clientY-ly; moved += Math.abs(dx)+Math.abs(dy);
    yaw += dx*0.006; pitch += dy*0.006;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
    lx = e.clientX; ly = e.clientY;
  } else {
    const n = pick(e.clientX,e.clientY);
    if (n !== hover){ hover = n; }
    if (n){ tip.textContent = n.label; tip.style.left = (e.clientX+14)+"px"; tip.style.top = (e.clientY-9)+"px"; tip.style.opacity = 1; }
    else tip.style.opacity = 0;
  }
});
cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.25, Math.min(4.5, zoom * (e.deltaY > 0 ? 0.9 : 1.1))); }, {passive:false});

/* ═══ panel ═══ */
const P = { el:document.getElementById("panel"), t:document.getElementById("pT"),
            tags:document.getElementById("pTags"), rows:document.getElementById("pRows"),
            why:document.getElementById("pWhy"), cx:document.getElementById("pCx"),
            cxhd:document.getElementById("pCxHd") };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function select(n){
  sel = n;
  if (!n){ P.el.classList.remove("on"); tgX = tgY = tgZ = 0; return; }
  tgX = n.x; tgY = n.y; tgZ = n.z;
  P.t.textContent = n.label;
  P.tags.innerHTML =
    `<span class="tag" style="border-color:${n.c};color:${n.c}">${esc((n.file_type||"?").toUpperCase())}</span>` +
    `<span class="tag">${esc(CLABEL[n.community] || ("CLUSTER " + n.community))}</span>` +
    (n.god ? `<span class="tag gd">GOD NODE</span>` : "");
  P.rows.innerHTML =
    row("ORIGEM", esc(n.source_file || "—") + (n.source_location ? " · " + esc(n.source_location) : "")) +
    row("GRAU", n.deg + " conexões") +
    row("ID", esc(n.id));
  P.why.innerHTML = n.rationale
    ? `<div class="sec">RACIONAL</div><div class="why">${esc(n.rationale)}</div>` : "";
  const es = nbr.get(n.id).slice().sort((a,b) => b.n.deg - a.n.deg);
  P.cxhd.textContent = "CONEXÕES · " + es.length;
  P.cx.innerHTML = es.map(e => {
    const c = e.l.confidence === "AMBIGUOUS" ? "amb" : e.l.confidence === "INFERRED" ? "inf" : "";
    const dir = e.l.s === n ? "→" : "←";
    return `<div class="cx ${c}" data-id="${esc(e.n.id)}"><span class="ar">${dir}</span>` +
           `<span class="rl">${esc(e.l.relation)}</span><span class="lb">${esc(e.n.label)}</span></div>`;
  }).join("");
  P.cx.querySelectorAll(".cx").forEach(el =>
    el.onclick = () => select(byId.get(el.dataset.id)));
  P.el.classList.add("on"); P.el.scrollTop = 0;
}
const row = (k,v) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
document.getElementById("pX").onclick = () => select(null);

/* ═══ legend ═══ */
const lgList = document.getElementById("lgList");
lgList.innerHTML = commIds.map(c =>
  `<div class="lg" data-c="${c}" style="color:${col(c)}"><span class="dot"></span>` +
  `<span class="nm">${esc(CLABEL[c] || ("Cluster " + c))}</span><span class="ct">${comms[c].length}</span></div>`
).join("");
lgList.querySelectorAll(".lg").forEach(el => el.onclick = () => {
  const c = +el.dataset.c;
  if (hidden.has(c)) hidden.delete(c); else hidden.add(c);
  el.classList.toggle("off", hidden.has(c));
  if (sel && hidden.has(sel.community)) select(null);
  alpha = Math.max(alpha, 0.35);
});

/* ═══ search ═══ */
const q = document.getElementById("q");
q.oninput = () => {
  query = q.value.trim().toLowerCase();
  if (!query){ matched = null; return; }
  matched = new Set(nodes.filter(n =>
    n.label.toLowerCase().includes(query) ||
    (n.source_file||"").toLowerCase().includes(query) ||
    (n.rationale||"").toLowerCase().includes(query)
  ).map(n => n.id));
};

/* ═══ controls ═══ */
const bL = document.getElementById("bLobe"), bS = document.getElementById("bSpin");
bL.onclick = () => { lobes = !lobes; bL.classList.toggle("on", lobes); alpha = Math.max(alpha, 0.5);
                     document.getElementById("mMode").textContent = lobes ? "CORTEX" : "NEBULA"; };
bS.onclick = () => { spin = !spin; bS.classList.toggle("on", spin); };
document.getElementById("bReal").onclick = () => {
  alpha = 1; nodes.forEach(n => { n.vx += (Math.random()-0.5)*8; n.vy += (Math.random()-0.5)*8; n.vz += (Math.random()-0.5)*8; });
};
addEventListener("keydown", e => {
  if (e.key === "Escape"){ select(null); q.value = ""; query = ""; matched = null; q.blur(); }
  if (e.key === " " && document.activeElement !== q){ e.preventDefault(); bS.click(); }
});

/* ═══ boot ═══ */
document.getElementById("sN").innerHTML = nodes.length;
document.getElementById("sE").innerHTML = links.length;
document.getElementById("sC").innerHTML = commIds.length;
document.getElementById("mCommit").textContent = (GRAPH.built_at_commit || "—").slice(0,7);
for (let i = 0; i < 260; i++) step();
draw();
</script>
</body>
</html>
