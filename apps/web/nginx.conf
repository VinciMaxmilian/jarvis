# PWA em PRODUÇÃO — nginx servindo o build estático do Vite.
#
# Este arquivo é copiado para /etc/nginx/conf.d/ pelo estágio `prod` do
# apps/web/Dockerfile. A imagem base faz `include /etc/nginx/conf.d/*.conf`, no
# contexto `http` — por isso o `map` abaixo (que SÓ vale em `http`) pode morar
# aqui, mas o snippet de cabeçalhos precisa terminar em `.inc` para NÃO ser
# incluído sozinho (ver o cabeçalho de nginx/security-headers.inc).
#
# O que este servidor substitui: o dev server do Vite. Até a v1.5 o túnel
# exporia o Vite à internet — HMR sobre WebSocket, `allowedHosts`, bundle não
# otimizado. Nada disso deve ficar acessível de fora.

# --------------------------------------------------------------------------- #
# WebSocket: `Connection` tem de ser CONDICIONAL, não fixo.
#
# O chat abre WebSocket em /api/chat/ws (apps/api/routers/chat.py). Fazer proxy
# disso exige repassar `Upgrade` e `Connection: upgrade`. Mas mandar
# `Connection: upgrade` em TODA requisição — que é o que uma linha fixa faz —
# quebra o keep-alive das requisições HTTP normais e manda um header de upgrade
# para quem não pediu upgrade nenhum.
#
# O `map` resolve: quando o cliente manda `Upgrade`, repassa `upgrade`; quando
# não manda ($http_upgrade vazio), manda `close`. É o padrão da doc do nginx.
# --------------------------------------------------------------------------- #
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173;

    # `_` = casa qualquer Host. Este é o único server block da imagem, logo é o
    # default server e receberia qualquer Host de todo jeito — o `_` só torna
    # isso explícito.
    #
    # CONSEQUÊNCIA PARA O TÚNEL: o nginx, ao contrário do dev server do Vite,
    # NÃO valida o header Host. O campo "HTTP Host Header = localhost:5173" da
    # rota do PWA no dashboard existia só para contornar o `server.allowedHosts`
    # do Vite (infrastructure/README.md §8.3). Com prod ele deixa de ser
    # necessário; deixá-lo preenchido também não quebra nada.
    server_name _;

    # Não anunciar a versão do nginx em header nem em página de erro.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # O maior arquivo servido hoje é o graph.json do mapa neural (~1,5 MB, vem
    # de apps/web/public/ e é lido por NeuralMap.tsx). Não há upload na API
    # (nenhum UploadFile em apps/api/routers/), então este limite só protege
    # contra corpo grande inesperado; o default do nginx é 1 MB e vira um 413
    # silencioso se um dia entrar upload.
    client_max_body_size 25m;

    # ----------------------------------------------------------------------- #
    # Resolução do upstream EM RUNTIME, não no boot.
    #
    # `proxy_pass http://api:8000` com o nome literal resolve UMA vez, quando o
    # nginx sobe, e cacheia o IP para sempre. Um `docker compose up -d --build
    # api` recria o container com IP novo e este nginx passa a dar 502 até
    # alguém reiniciar o `web-prod` — sintoma caro, causa invisível.
    #
    # Com `resolver` + variável, o nome é resolvido a cada requisição. 127.0.0.11
    # é o DNS embutido do Docker, presente em qualquer rede definida pelo
    # usuário (a rede default do Compose é uma). ipv6=off porque a stack é toda
    # IPv4 e uma consulta AAAA que sempre falha só adiciona latência.
    #
    # Efeito colateral bom: com variável, o nginx SOBE mesmo se `api` ainda não
    # existir (com nome literal ele se recusa a iniciar) — e responde 502 até a
    # API aparecer, em vez de não subir.
    # ----------------------------------------------------------------------- #
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_origin http://api:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ----------------------------------------------------------------------- #
    # /assets/ — nomes com hash de conteúdo (index-CBdmDIGn.js). Conteúdo novo
    # significa nome novo, então cache imutável de 1 ano é seguro e tira o
    # revalidate de todo carregamento.
    #
    # `=404` em vez do fallback para index.html: um asset que não existe é um
    # deploy quebrado. Devolver o HTML do SPA aqui faria o browser tentar
    # executar `<!doctype html>` como JavaScript, e o erro apareceria como
    # "Unexpected token '<'" — que não diz nada sobre a causa.
    # ----------------------------------------------------------------------- #
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------------- #
    # /api/ — atravessa para a API. Cobre o WebSocket /api/chat/ws.
    #
    # DEFESA EM PROFUNDIDADE, e não redundância inútil: o túnel roteia
    # `^/api(/|$)` DIRETO para 127.0.0.1:8000, sem passar por aqui
    # (infrastructure/cloudflared/ingress.expected.yml). Este bloco é o que
    # atende (a) o acesso local a http://127.0.0.1:5174 e (b) o caso em que as
    # rotas do dashboard estejam na ordem errada — aí o /api/ cai no PWA, e com
    # este proxy ele ainda funciona em vez de devolver index.html para o
    # WebSocket. Ver README §8.3.
    # ----------------------------------------------------------------------- #
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;

        # $request_uri preserva path + query string. É obrigatório com upstream
        # em variável: nessa forma o nginx não reescreve a URI sozinho.
        proxy_pass $api_origin$request_uri;

        # 1.1 é pré-requisito do Upgrade; o default do proxy do nginx é 1.0.
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Repassa a identidade que o Cloudflare Access injeta. Sem estes dois, o
        # middleware de apps/api/cf_access.py não vê o JWT e, com o gate ligado,
        # recusa todo request que chegar por aqui.
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Cookie                  $http_cookie;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming: a resposta do chat vem token a token. Com buffering ligado
        # (default) o nginx segura os pedaços e entrega tudo junto no fim — o
        # streaming continua "funcionando" e a UI só para de ser streaming.
        proxy_buffering off;
        proxy_cache off;

        # O default de proxy_read_timeout é 60s. Um WebSocket ocioso por mais de
        # um minuto — que é o normal de um chat aberto sem ninguém digitando —
        # seria derrubado pelo nginx, e o front veria uma desconexão sem causa.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ----------------------------------------------------------------------- #
    # /health — a rota é da API (apps/api/main.py: @app.get("/health")), mas NÃO
    # começa com /api, então o túnel a manda para o PWA. Sem este bloco, o
    # `curl https://ia.atmosintelli.com.br/health` do README §8.7 cairia no
    # try_files e devolveria o index.html com 200 — um healthcheck que passa
    # sempre, inclusive com a API morta. Que é pior do que não ter healthcheck.
    # ----------------------------------------------------------------------- #
    location = /health {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # ----------------------------------------------------------------------- #
    # SPA: qualquer path desconhecido devolve o index.html, para o react-router
    # resolver a rota no cliente (um F5 em /goals tem de funcionar).
    #
    # `no-cache` no index.html (e nos estáticos de raiz: favicon.svg,
    # manifest.json, graph.json): o index referencia os assets pelo nome com
    # hash, então um index cacheado é um deploy que não chega ao browser.
    # `no-cache` não impede o armazenamento — obriga a revalidar, e a
    # revalidação devolve 304 quando nada mudou.
    # ----------------------------------------------------------------------- #
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
